name: Build Hawwel (Windows)

on:
  push:
    branches: [main]
    paths: ['HawwelWin/**', '.github/workflows/windows.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # علشان نعمل GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (single-file, self-contained)
        working-directory: HawwelWin
        run: dotnet publish HawwelWin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" HawwelWin\installer\Hawwel.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Hawwel-Setup
          path: HawwelWin/dist/Hawwel-Setup.exe

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: HawwelWin/dist/Hawwel-Setup.exe
